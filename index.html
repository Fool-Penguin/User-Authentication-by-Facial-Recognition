<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Face Login Demo (Webcam)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      text-align: center;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    video, canvas {
      width: 100%;
      max-width: 560px;
      border-radius: 12px;
      background: #000;
    }
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      font-size: 14px;
      margin-right: 8px;
    }
    button.secondary {
      background: #6b7280;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #status {
      margin-top: 8px;
      min-height: 24px;
    }
    #result {
      margin-top: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Face Login Demo (Webcam)</h1>

  <div class="card">
    <p><strong>Step 1:</strong> Start your webcam.</p>
    <video id="video" autoplay playsinline></video>
    <!-- Hidden canvas for capture -->
    <canvas id="canvas" style="display:none;"></canvas>

    <div style="margin-top: 12px;">
      <button id="startBtn" class="secondary">Start Camera</button>
      <button id="captureBtn">Capture &amp; Login</button>
    </div>

    <div id="status"></div>
    <div id="result"></div>
  </div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const startBtn = document.getElementById("startBtn");
    const captureBtn = document.getElementById("captureBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    let stream = null;

    // Start camera
    startBtn.addEventListener("click", async () => {
      try {
        statusEl.textContent = "Requesting camera permission...";
        resultEl.textContent = "";

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false,
        });

        video.srcObject = stream;
        statusEl.textContent = "✅ Camera started. Make sure your face is visible.";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "❌ Could not start camera: " + err.message;
      }
    });

    // Capture frame & send to server
    captureBtn.addEventListener("click", async () => {
      if (!stream) {
        statusEl.textContent = "⚠️ Please start the camera first.";
        return;
      }

      statusEl.textContent = "⏳ Capturing frame...";
      resultEl.textContent = "";

      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;

      if (!videoWidth || !videoHeight) {
        statusEl.textContent = "⚠️ Waiting for video to be ready. Try again in a moment.";
        return;
      }

      canvas.width = videoWidth;
      canvas.height = videoHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, videoWidth, videoHeight);

      canvas.toBlob(async (blob) => {
        if (!blob) {
          statusEl.textContent = "❌ Failed to capture image.";
          return;
        }

        statusEl.textContent = "⏳ Sending image to server...";
        captureBtn.disabled = true;

        try {
          const formData = new FormData();
          formData.append("image", blob, "capture.jpg");

          const res = await fetch("/recognize_face", {
            method: "POST",
            body: formData,
          });

          if (!res.ok) {
            const text = await res.text();
            statusEl.textContent = `❌ Server error: ${res.status}`;
            console.error(text);
            captureBtn.disabled = false;
            return;
          }

          const data = await res.json();
          console.log("Server response:", data);

          // If recognized + real + authorized → redirect
          if (data.ok && data.recognized && data.real && data.authorized) {
            statusEl.textContent = "✅ Access granted! Redirecting...";
            // Small delay so user sees the message
            setTimeout(() => {
              window.location.href = "/success";
            }, 500);
            return;
          }

          // Otherwise show reason
          statusEl.textContent = "⚠️ Face not recognized or not authorized.";
          resultEl.textContent = `Reason: ${data.reason}`;

        } catch (err) {
          console.error(err);
          statusEl.textContent = "❌ Request failed: " + err.message;
        } finally {
          captureBtn.disabled = false;
        }
      }, "image/jpeg", 0.9);
    });

    // Stop camera on page unload (optional)
    window.addEventListener("beforeunload", () => {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
      }
    });
  </script>
</body>
</html>
